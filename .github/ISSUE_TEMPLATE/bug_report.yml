name: Bug Report
description: Report a functional, performance, or security issue.
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please provide as much detail as possible.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is the problem?
      placeholder: Briefly describe the issue.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide exact steps and sample inputs.
      placeholder: |
        1. Start backend
        2. Start frontend
        3. Upload sample image
        4. Observe failure
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: severity
    attributes:
      label: Severity
      description: low / medium / high / critical
      placeholder: medium
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and Screenshots
      description: Paste logs and add screenshots if relevant.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have removed sensitive data from logs/screenshots.
          required: true
        - label: I searched for existing issues before submitting.
          required: true
