name: Feature Request
description: Propose an enhancement with business and technical context.
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What user or business problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the expected behavior and flow.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and Non-Goals
      description: Compliance, security, performance, and scope limits.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Define measurable completion criteria.
      placeholder: |
        - Criteria 1
        - Criteria 2
    validations:
      required: true

  - type: input
    id: priority
    attributes:
      label: Priority
      description: P0 / P1 / P2 / P3
      placeholder: P2
